[package]
name = "gitsmart"
version = "0.1.0"
edition = "2021"
description = "Read-only git dashboard TUI: worktree, log, branches, tags and a side-by-side diff"
license = "MIT"
repository = "https://github.com/elvisoliveira/gitsmart"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ansi-to-tui = "7"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = "0.5"
unicode-width = "0.2"
# delta measures and truncates with these exact versions
unicode-width-delta = { package = "unicode-width", version = "=0.1.14" }
unicode-segmentation = "=1.12.0"

[profile.release]
lto = true
strip = true
